# Fichier géré automatiquement par le Développeur (menckley/audit-repos) : ne pas modifier.
# Dès qu'un workflow se termine en échec sur la branche principale, le Réparateur est appelé :
# il relance, cherche le merge fautif, l'annule si besoin, relance et te prévient.
name: 🚨 Alerte Réparateur

on:
  workflow_run:
    workflows: ["CI", "Récap géopolitique"]
    types: [completed]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

concurrency:
  group: reparateur
  cancel-in-progress: false

jobs:
  reparer:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      contains(github.event.workflow_run.head_commit.message, '[réparation-auto]')
    uses: menckley/audit-repos/.github/workflows/reparateur.yml@main
